<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Log Distiller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; }
    .drop-active { border-color: #6366f1 !important; background: rgba(99,102,241,0.07) !important; }
    #drop-zone { transition: border-color .2s, background .2s; }
    .result-text { white-space: pre-wrap; font-family: inherit; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-8 space-y-5">

  <!-- Header -->
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Audio Log Distiller</h1>
      <p class="text-slate-500 text-xs mt-0.5">文字起こし / 話者識別 / Ollama 要約</p>
    </div>
    <button id="history-toggle" class="flex-shrink-0 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-colors">
      🗂 履歴
    </button>
  </div>

  <!-- History Panel -->
  <div id="history-section" class="hidden bg-slate-900 rounded-xl border border-slate-800 p-5 space-y-3">
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">処理履歴</span>
      <button id="history-refresh" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">更新</button>
    </div>
    <div id="history-list" class="space-y-2 max-h-[28rem] overflow-y-auto"></div>
    <div id="history-empty" class="hidden text-xs text-slate-600 text-center py-6">履歴がありません</div>
    <div id="history-loading" class="hidden text-xs text-slate-600 text-center py-6">読み込み中...</div>
  </div>

  <!-- Upload Form -->
  <div id="form-section" class="bg-slate-900 rounded-xl border border-slate-800 p-5 space-y-4">

    <!-- Drop Zone -->
    <div
      id="drop-zone"
      class="border-2 border-dashed border-slate-700 rounded-lg p-7 text-center cursor-pointer hover:border-indigo-600 hover:bg-indigo-950/20 transition-colors"
    >
      <div id="drop-label">
        <div class="text-2xl mb-2">🎙</div>
        <div class="text-slate-300 text-sm font-medium">ここにファイルをドロップ</div>
        <div class="text-slate-600 text-xs mt-1">または クリックして選択 (m4a / mp3 / mp4 / wav / flac など)</div>
      </div>
      <div id="file-selected" class="hidden">
        <div class="text-indigo-400 text-sm font-medium" id="file-name"></div>
        <div class="text-slate-600 text-xs mt-0.5" id="file-size"></div>
      </div>
      <input id="file-input" type="file" accept="audio/*,video/*,.m4a,.mp3,.mp4,.flac,.ogg,.wav,.aac,.opus,.webm" class="hidden">
    </div>

    <!-- Options Grid -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs text-slate-500 mb-1">モデル</label>
        <select id="model" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
          <option value="tiny">tiny（高速・低精度）</option>
          <option value="small" selected>small（推奨）</option>
          <option value="medium">medium</option>
          <option value="large-v3">large-v3（高精度）</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">言語</label>
        <select id="language" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
          <option value="ja" selected>日本語</option>
          <option value="en">English</option>
          <option value="auto">自動検出</option>
        </select>
      </div>
    </div>

    <div class="space-y-1.5">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="summarize" checked class="w-3.5 h-3.5 accent-indigo-500">
        <span class="text-xs text-slate-300">要約 (Ollama)</span>
      </label>
      <div id="summary-type-row" class="pl-5 space-y-1.5">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-500 mb-1">シナリオ</label>
            <select id="summary-type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="general">汎用</option>
              <option value="lecture">大学の講義</option>
              <option value="meeting">仕事のミーティング</option>
              <option value="casual">雑談</option>
              <option value="briefing">説明会</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">LLM モデル</label>
            <select id="ollama-model" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">デフォルト (.env)</option>
            </select>
          </div>
        </div>
      </div>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="diarize" class="w-3.5 h-3.5 accent-indigo-500">
        <span class="text-xs text-slate-300">話者識別 (pyannote)</span>
      </label>
      <div id="speakers-row" class="hidden pl-5 flex items-center gap-2">
        <span class="text-xs text-slate-500">話者数</span>
        <input
          type="number" id="speakers" min="1" max="20" placeholder="自動"
          class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
        >
      </div>
    </div>

    <button
      id="submit-btn"
      class="w-full bg-indigo-700 hover:bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-white text-sm font-medium py-2.5 rounded-lg transition-colors"
      disabled
    >
      文字起こし開始
    </button>
  </div>

  <!-- Status + Results -->
  <div id="result-section" class="hidden space-y-4">

    <!-- Status Card -->
    <div id="status-card" class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center gap-3">
      <div id="status-spinner" class="hidden w-4 h-4 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
      <div id="status-check" class="hidden text-green-400 flex-shrink-0">✓</div>
      <div id="status-x" class="hidden text-red-400 flex-shrink-0">✗</div>
      <div class="flex-1 min-w-0">
        <div id="status-text" class="text-sm text-slate-300"></div>
        <div id="error-detail" class="hidden mt-1 text-xs text-red-400 break-all"></div>
      </div>
    </div>

    <!-- Transcript -->
    <div id="result-transcript" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">文字起こし</span>
          <span id="transcript-streaming" class="hidden text-xs text-indigo-400 animate-pulse">生成中...</span>
        </div>
        <div class="flex gap-1.5">
          <button onclick="copyEl('transcript-content')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">コピー</button>
          <button onclick="dlText('transcript-content','transcript.txt')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">DL</button>
        </div>
      </div>
      <div id="transcript-content" class="result-text text-xs text-slate-300 bg-slate-950 rounded-lg p-3 max-h-60 overflow-y-auto border border-slate-800/60"></div>
    </div>

    <!-- Diarized -->
    <div id="result-diarized" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">話者識別付き文字起こし</span>
        <div class="flex gap-1.5">
          <button onclick="copyEl('diarized-content')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">コピー</button>
          <button onclick="dlText('diarized-content','diarized.txt')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">DL</button>
        </div>
      </div>
      <div id="diarized-content" class="result-text text-xs text-slate-300 bg-slate-950 rounded-lg p-3 max-h-60 overflow-y-auto border border-slate-800/60"></div>
    </div>

    <!-- Summary -->
    <div id="result-summary" class="hidden bg-slate-900 border border-indigo-900/50 rounded-xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Ollama 要約</span>
          <span id="summary-streaming" class="hidden text-xs text-indigo-400 animate-pulse">生成中...</span>
        </div>
        <div class="flex gap-1.5">
          <button onclick="copyEl('summary-content')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">コピー</button>
          <button onclick="dlText('summary-content','summary.txt')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2.5 py-1 rounded transition-colors">DL</button>
        </div>
      </div>
      <div id="summary-content" class="result-text text-xs text-slate-300 bg-slate-950 rounded-lg p-3 max-h-72 overflow-y-auto border border-slate-800/60"></div>
    </div>

    <!-- Summary error (non-fatal) -->
    <div id="result-summary-error" class="hidden bg-slate-900 border border-amber-900/40 rounded-xl p-4">
      <span class="text-xs font-semibold text-amber-500 uppercase tracking-wider">要約エラー</span>
      <div id="summary-error-detail" class="mt-1 text-xs text-amber-400 break-all"></div>
    </div>

    <!-- Reset / Back -->
    <button id="back-to-history-btn" class="hidden w-full bg-slate-800 hover:bg-slate-700 text-slate-400 text-sm py-2.5 rounded-lg transition-colors">
      ← 履歴に戻る
    </button>
    <button id="new-job-btn" class="hidden w-full bg-slate-800 hover:bg-slate-700 text-slate-400 text-sm py-2.5 rounded-lg transition-colors">
      別のファイルを処理する
    </button>
  </div>

</div>
<script>
const fileInput = document.getElementById('file-input');
const dropZone  = document.getElementById('drop-zone');
const submitBtn = document.getElementById('submit-btn');
let selectedFile = null, pollTimer = null;

// 実行中ジョブの ID を保持。ページを閉じて再訪しても処理状況・結果へ復帰できる。
const ACTIVE_KEY = 'alid_active_job';

// File input
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

// Drag & drop
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drop-active'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drop-active');
  handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  document.getElementById('drop-label').classList.add('hidden');
  document.getElementById('file-selected').classList.remove('hidden');
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-size').textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
  submitBtn.disabled = false;
}

document.getElementById('diarize').addEventListener('change', function () {
  document.getElementById('speakers-row').classList.toggle('hidden', !this.checked);
});
document.getElementById('summarize').addEventListener('change', function () {
  document.getElementById('summary-type-row').classList.toggle('hidden', !this.checked);
});

// Submit
submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  const fd = new FormData();
  fd.append('file', selectedFile);
  fd.append('model', document.getElementById('model').value);
  fd.append('language', document.getElementById('language').value);
  fd.append('diarize', document.getElementById('diarize').checked ? 'true' : 'false');
  fd.append('speakers', document.getElementById('speakers').value || '');
  fd.append('summarize', document.getElementById('summarize').checked ? 'true' : 'false');
  fd.append('summary_type', document.getElementById('summary-type').value);
  fd.append('ollama_model', document.getElementById('ollama-model').value);

  submitBtn.disabled = true;
  document.getElementById('form-section').style.opacity = '0.5';
  document.getElementById('form-section').style.pointerEvents = 'none';
  document.getElementById('result-section').classList.remove('hidden');
  setStatus('uploading');

  try {
    const res = await fetch('/api/jobs', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const { job_id } = await res.json();
    localStorage.setItem(ACTIVE_KEY, job_id);  // 閉じても復帰できるよう記録
    pollJob(job_id);
  } catch (e) {
    setStatus('error', e.message);
    document.getElementById('new-job-btn').classList.remove('hidden');
  }
});

function pollJob(jobId) {
  pollTimer = setInterval(async () => {
    try {
      const job = await fetch(`/api/jobs/${jobId}`).then(r => r.json());
      if (!job.status) {
        // メモリから消えた（サーバー再起動等）→ 履歴に保存されていれば表示
        clearInterval(pollTimer);
        localStorage.removeItem(ACTIVE_KEY);
        tryShowFromHistory(jobId);
        return;
      }
      setStatus(job.status, job.error);

      // Show partial results live while processing
      const transcribing = job.status === 'transcribing';
      const summarizing  = ['summarizing', 'diarizing'].includes(job.status);
      if (job.partial_transcript) {
        document.getElementById('transcript-content').textContent = job.partial_transcript;
        document.getElementById('result-transcript').classList.remove('hidden');
        document.getElementById('transcript-streaming').classList.toggle('hidden', !transcribing);
      }
      if (job.partial_summary != null) {
        document.getElementById('summary-content').textContent = job.partial_summary;
        document.getElementById('result-summary').classList.remove('hidden');
        document.getElementById('summary-streaming').classList.toggle('hidden', !summarizing);
      }

      if (job.status === 'done') {
        clearInterval(pollTimer);
        localStorage.removeItem(ACTIVE_KEY);
        document.getElementById('transcript-streaming').classList.add('hidden');
        document.getElementById('summary-streaming').classList.add('hidden');
        showResults(job.result);
        document.getElementById('new-job-btn').classList.remove('hidden');
      } else if (job.status === 'error') {
        clearInterval(pollTimer);
        localStorage.removeItem(ACTIVE_KEY);
        document.getElementById('new-job-btn').classList.remove('hidden');
      }
    } catch (_) { /* network hiccup — keep polling */ }
  }, 1500);
}

const STATUS_LABELS = {
  uploading:    'アップロード中...',
  queued:       'キュー待機中...',
  transcribing: '文字起こし中...',
  diarizing:    '話者識別中 (pyannote)...',
  summarizing:  'Ollama で要約中...',
  done:         '完了',
  error:        'エラー',
};

function setStatus(status, msg) {
  ['status-spinner','status-check','status-x'].forEach(id =>
    document.getElementById(id).classList.add('hidden'));
  document.getElementById('error-detail').classList.add('hidden');
  document.getElementById('status-text').textContent = STATUS_LABELS[status] || status;
  const card = document.getElementById('status-card');
  card.className = card.className.replace(/border-\S+/g, 'border-slate-800');

  if (status === 'done') {
    document.getElementById('status-check').classList.remove('hidden');
    card.classList.replace('border-slate-800', 'border-green-900');
  } else if (status === 'error') {
    document.getElementById('status-x').classList.remove('hidden');
    card.classList.replace('border-slate-800', 'border-red-900');
    if (msg) {
      document.getElementById('error-detail').textContent = msg;
      document.getElementById('error-detail').classList.remove('hidden');
    }
  } else {
    document.getElementById('status-spinner').classList.remove('hidden');
  }
}

function showResults(r) {
  if (r.diarized_transcript) {
    document.getElementById('diarized-content').textContent = r.diarized_transcript;
    document.getElementById('result-diarized').classList.remove('hidden');
  }
  if (r.transcript) {
    document.getElementById('transcript-content').textContent = r.transcript;
    document.getElementById('result-transcript').classList.remove('hidden');
  }
  if (r.summary) {
    document.getElementById('summary-content').textContent = r.summary;
    document.getElementById('result-summary').classList.remove('hidden');
  }
  if (r.summary_error) {
    document.getElementById('summary-error-detail').textContent = r.summary_error;
    document.getElementById('result-summary-error').classList.remove('hidden');
  }
}

function copyEl(id) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).catch(() => {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  });
}

function dlText(id, filename) {
  const url = URL.createObjectURL(new Blob([document.getElementById(id).textContent], { type: 'text/plain;charset=utf-8' }));
  Object.assign(document.createElement('a'), { href: url, download: filename }).click();
  URL.revokeObjectURL(url);
}

// Populate Ollama model dropdown on load
(async () => {
  try {
    const { models } = await fetch('/api/models').then(r => r.json());
    const sel = document.getElementById('ollama-model');
    const defaultModel = sel.querySelector('option[value=""]').textContent;
    models.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  } catch (_) {}
})();

// ── フォームへリセット ───────────────────────────────────────────
function resetToForm() {
  clearInterval(pollTimer); pollTimer = null;
  selectedFile = null; fileInput.value = '';
  document.getElementById('drop-label').classList.remove('hidden');
  document.getElementById('file-selected').classList.add('hidden');
  submitBtn.disabled = true;
  const form = document.getElementById('form-section');
  form.classList.remove('hidden');
  form.style.opacity = '';
  form.style.pointerEvents = '';
  ['result-section','result-transcript','result-diarized','result-summary',
   'result-summary-error','new-job-btn','back-to-history-btn'].forEach(id =>
    document.getElementById(id).classList.add('hidden'));
}

document.getElementById('new-job-btn').addEventListener('click', resetToForm);

// ── 履歴 ─────────────────────────────────────────────────────────
const SUMMARY_TYPE_LABELS = {
  general: '汎用', lecture: '講義', meeting: 'ミーティング', casual: '雑談', briefing: '説明会',
};

function fmtDate(ts) {
  if (!ts) return '';
  return new Date(ts * 1000).toLocaleString('ja-JP',
    { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function loadHistory() {
  const listEl = document.getElementById('history-list');
  const emptyEl = document.getElementById('history-empty');
  const loadingEl = document.getElementById('history-loading');
  listEl.innerHTML = '';
  emptyEl.classList.add('hidden');
  loadingEl.classList.remove('hidden');
  let items = [];
  try {
    ({ history: items } = await fetch('/api/history').then(r => r.json()));
  } catch (_) { /* ignore */ }
  loadingEl.classList.add('hidden');
  if (!items.length) { emptyEl.classList.remove('hidden'); return; }

  items.forEach(it => {
    const ok = it.status === 'done';
    const badges = [
      SUMMARY_TYPE_LABELS[it.summary_type] && it.has_summary ? `要約(${SUMMARY_TYPE_LABELS[it.summary_type]})` : null,
      it.has_diarized ? '話者識別' : null,
      it.model,
    ].filter(Boolean);

    const row = document.createElement('div');
    row.className = 'group flex items-start gap-2 bg-slate-950 border border-slate-800/60 rounded-lg p-3 hover:border-indigo-700 transition-colors';
    row.innerHTML = `
      <button class="flex-1 min-w-0 text-left" data-view="${it.id}">
        <div class="flex items-center gap-2">
          <span class="${ok ? 'text-green-400' : 'text-red-400'} text-xs">${ok ? '✓' : '✗'}</span>
          <span class="text-xs text-slate-200 font-medium truncate">${escapeHtml(it.filename || '(no name)')}</span>
        </div>
        <div class="text-[11px] text-slate-500 mt-0.5">${fmtDate(it.created_at)} · ${badges.map(escapeHtml).join(' · ')}</div>
        <div class="text-[11px] text-slate-600 mt-1 line-clamp-2">${escapeHtml(it.preview || '')}</div>
      </button>
      <button class="flex-shrink-0 text-slate-600 hover:text-red-400 text-xs px-1.5 py-0.5 opacity-0 group-hover:opacity-100 transition-opacity" data-del="${it.id}" title="削除">🗑</button>`;
    listEl.appendChild(row);
  });

  listEl.querySelectorAll('[data-view]').forEach(b =>
    b.addEventListener('click', () => viewHistoryItem(b.dataset.view)));
  listEl.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); deleteHistoryItem(b.dataset.del); }));
}

async function viewHistoryItem(id, { keepHistoryOpen = false } = {}) {
  let rec;
  try {
    const res = await fetch(`/api/history/${id}`);
    if (!res.ok) throw new Error();
    rec = await res.json();
  } catch (_) { return false; }

  clearInterval(pollTimer); pollTimer = null;
  document.getElementById('form-section').classList.add('hidden');
  if (!keepHistoryOpen) document.getElementById('history-section').classList.add('hidden');
  document.getElementById('result-section').classList.remove('hidden');

  ['result-transcript','result-diarized','result-summary','result-summary-error'].forEach(i =>
    document.getElementById(i).classList.add('hidden'));
  document.getElementById('transcript-streaming').classList.add('hidden');
  document.getElementById('summary-streaming').classList.add('hidden');

  if (rec.status === 'error') setStatus('error', rec.error);
  else setStatus('done');
  document.getElementById('status-text').textContent =
    `${rec.filename || ''} — ${fmtDate(rec.created_at)}`;

  if (rec.result) showResults(rec.result);
  document.getElementById('back-to-history-btn').classList.remove('hidden');
  document.getElementById('new-job-btn').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  return true;
}

async function deleteHistoryItem(id) {
  if (!confirm('この履歴を削除しますか？')) return;
  try { await fetch(`/api/history/${id}`, { method: 'DELETE' }); } catch (_) {}
  loadHistory();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('history-toggle').addEventListener('click', () => {
  const sec = document.getElementById('history-section');
  const show = sec.classList.contains('hidden');
  sec.classList.toggle('hidden', !show);
  if (show) loadHistory();
});
document.getElementById('history-refresh').addEventListener('click', loadHistory);
document.getElementById('back-to-history-btn').addEventListener('click', () => {
  resetToForm();
  const sec = document.getElementById('history-section');
  sec.classList.remove('hidden');
  loadHistory();
});

function tryShowFromHistory(id) {
  viewHistoryItem(id).then(found => { if (!found) resetToForm(); });
}

// ── 起動時: 実行中ジョブがあれば復帰、なければ何もしない ──────────────
(async () => {
  const id = localStorage.getItem(ACTIVE_KEY);
  if (!id) return;
  try {
    const res = await fetch(`/api/jobs/${id}`);
    if (res.ok) {
      const job = await res.json();
      if (job.status && !['done', 'error'].includes(job.status)) {
        // まだ処理中 — UI を復元してポーリング再開
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('form-section').style.opacity = '0.5';
        document.getElementById('form-section').style.pointerEvents = 'none';
        pollJob(id);
        return;
      }
      // 既に終了 — 結果を表示して記録をクリア
      localStorage.removeItem(ACTIVE_KEY);
      document.getElementById('result-section').classList.remove('hidden');
      setStatus(job.status, job.error);
      if (job.result) showResults(job.result);
      document.getElementById('new-job-btn').classList.remove('hidden');
      return;
    }
  } catch (_) { /* fall through to history */ }
  // メモリに無い（再起動等）→ 履歴から復元を試みる
  localStorage.removeItem(ACTIVE_KEY);
  viewHistoryItem(id);
})();
</script>
