<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — Audio Log Distiller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-slate-900 rounded-xl border border-slate-800 p-6 space-y-5">
    <div class="text-center">
      <div class="text-2xl mb-2">🔒</div>
      <h1 class="text-lg font-bold tracking-tight">Audio Log Distiller</h1>
      <p class="text-slate-500 text-xs mt-1">続けるにはログインしてください</p>
    </div>

    <form id="login-form" class="space-y-3">
      <input
        id="password" type="password" autocomplete="current-password" placeholder="パスワード" autofocus
        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
      >
      <button
        id="submit" type="submit"
        class="w-full bg-indigo-700 hover:bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-600 text-white text-sm font-medium py-2.5 rounded-lg transition-colors"
      >ログイン</button>
      <div id="error" class="hidden text-xs text-red-400 text-center"></div>
    </form>
  </div>

<script>
const form = document.getElementById('login-form');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submit');

// すでに認証済みならトップへ
(async () => {
  try {
    const { authenticated } = await fetch('/auth/check').then(r => r.json());
    if (authenticated) location.replace('/');
  } catch (_) {}
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.add('hidden');
  submitBtn.disabled = true;
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (res.ok) {
      location.replace('/');
      return;
    }
    const data = await res.json().catch(() => ({}));
    errorEl.textContent =
      res.status === 429 ? '試行回数が多すぎます。しばらく待ってください。'
      : (data.error || 'ログインに失敗しました');
    errorEl.classList.remove('hidden');
  } catch (_) {
    errorEl.textContent = '通信エラーが発生しました';
    errorEl.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    document.getElementById('password').value = '';
  }
});
</script>
</body>
</html>
