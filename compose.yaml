name: audio-log-distiller

services:
  audio-log-distiller:
    build: .
    container_name: audio-log-distiller
    restart: unless-stopped
    env_file: .env
    volumes:
      - hf-cache:/root/.cache/huggingface
      - history:/data
    networks:
      - proxy_net
      - ollama_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
  history:

networks:
  proxy_net:
    external: true
  ollama_net:
    external: true
